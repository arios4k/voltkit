<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <mask id="cut">
      <rect width="16" height="16" fill="#fff"/>
      <!-- open jaw of the wrench -->
      <g transform="translate(9.8 6.2) rotate(45)">
        <rect x="-1.15" y="-7.5" width="2.3" height="3.9" fill="#000"/>
        <circle cx="0" cy="-3.6" r="1.15" fill="#000"/>
      </g>
      <!-- gap around the bolt so the two shapes stay separate -->
      <path d="M7.1 3 L4 8.6 L6.1 8.6 L5.1 13.4 L9.7 6.9 L7.4 6.9 L9 3 Z"
            fill="#000" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#241f31">
    <g mask="url(#cut)">
      <g transform="translate(9.8 6.2) rotate(45)">
        <circle cx="0" cy="-3.6" r="3"/>
        <rect x="-1.15" y="-2.6" width="2.3" height="9.8" rx="1.15"/>
      </g>
    </g>
    <path d="M7.1 3 L4 8.6 L6.1 8.6 L5.1 13.4 L9.7 6.9 L7.4 6.9 L9 3 Z" stroke-linejoin="round"/>
  </g>
</svg>
