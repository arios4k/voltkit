name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
      - run: cargo test
      # Every message in the sources is in each translation, and the catalogs are current.
      - run: python3 po/update.py --check
      # The manual builds, with no broken links or missing screenshots.
      - run: python3 docs/manual/build.py "$RUNNER_TEMP/manual"

  # Build the Fedora package from this commit, in real Fedora, so packaging
  # problems show up before a release is published.
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf -y install rpm-build rpmdevtools git cargo rust gcc gtk4-devel libadwaita-devel libappstream-glib  # git first, so checkout makes a real clone
      - uses: actions/checkout@v4
      - name: Build the package
        run: |
          version=$(sed -n 's/^Version: *//p' packaging/rpm/voltkit.spec)
          git config --global --add safe.directory "$PWD"
          mkdir -p ~/rpmbuild/SOURCES
          # The release tarball doesn't exist yet: use this commit instead.
          git archive --prefix="voltkit-$version/" -o ~/rpmbuild/SOURCES/voltkit-$version.tar.gz HEAD
          rpmbuild -ba packaging/rpm/voltkit.spec
          # The container's minimal systemd stand-in must make way for the real one.
          dnf -y install --allowerasing ~/rpmbuild/RPMS/*/voltkit-*.rpm
          voltkit --version
