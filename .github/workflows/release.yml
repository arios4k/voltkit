name: Release

# Pushing a tag like v0.2.0 builds the .deb, publishes a GitHub Release with it,
# and rebuilds the signed APT repository served at https://arios4k.github.io/voltkit.
# A tag also asks COPR to build the Fedora package from the repository (packaging/rpm/voltkit.spec,
# which downloads the tag). That needs the repository secret COPR_WEBHOOK_URL and is skipped with a
# notice until it exists.
# Running it by hand only rebuilds the APT repository from existing releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public fingerprint of the APT signing key; the secret key is in secrets.APT_SIGNING_KEY.
  APT_KEY_ID: 65E84B8D114C61479CCA4DDCEC0F6B66E4802360

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev apt-utils

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the .deb
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          cargo install cargo-deb --locked
          cargo deb

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/debian/*.deb --title "Voltkit $GITHUB_REF_NAME" --generate-notes

      - name: Collect every released .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir debs --clobber
          done
          ls -l debs

      - name: Build the signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          packaging/apt/build-repo.sh debs site

      - name: Build the manual
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          python3 docs/manual/build.py site/manual --version "$version"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  copr:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Ask COPR to build the Fedora package
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::notice::COPR_WEBHOOK_URL is not set, so COPR was not asked to build. Add it (see docs/PUBLISHING.md) or press Rebuild on COPR."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$COPR_WEBHOOK_URL"
          echo "COPR was asked to build ${GITHUB_REF_NAME#v}."
