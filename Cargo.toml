[package]
name = "powerlinux"
version = "0.1.0"
edition = "2024"
description = "A unified suite of PowerToys-style micro-utilities for Linux"
license = "MIT"
keywords = ["gtk4", "libadwaita", "ocr", "color-picker", "text-expansion"]
categories = ["gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
