[package]
name = "voltkit"
version = "0.1.0"
authors = ["Alexis Rios-Negron"]
edition = "2024"
description = "A unified suite of PowerToys-style micro-utilities for Linux"
license = "MIT"
repository = "https://github.com/arios4k/voltkit"
homepage = "https://github.com/arios4k/voltkit"
keywords = ["gtk4", "libadwaita", "ocr", "color-picker", "text-expansion"]
categories = ["gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["global_shortcuts", "screenshot", "remote_desktop", "screencast"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
dirs = "7.0.0"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
roff = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "signal", "time", "sync"] }
toml = "1.1.8"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[package.metadata.deb]
maintainer = "Alexis Rios-Negron <arios4k@users.noreply.github.com>"
copyright = "2026, Alexis Rios-Negron"
section = "utils"
priority = "optional"
# $auto adds the GTK4/libadwaita libraries the binary links against.
depends = "$auto, tesseract-ocr, tesseract-ocr-eng, wl-clipboard | xclip, xdg-desktop-portal"
recommends = "jpegoptim, webp, ffmpeg"
extended-description = """\
Voltkit brings PowerToys-style micro-utilities to Linux in one GTK4/libadwaita \
app and a single command: system-wide OCR (Super+Shift+T), a screen color \
picker with contrast checking (Super+Shift+C), a metadata-stripping image and \
video compressor, and a text expander with a snippet picker (Super+Shift+E) \
and optional typed triggers. Run `voltkit doctor` after installing."""
assets = [
    ["target/release/voltkit", "usr/bin/", "755"],
    ["data/io.github.arios4k.Voltkit.desktop", "usr/share/applications/", "644"],
    ["data/icons/io.github.arios4k.Voltkit.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/io.github.arios4k.Voltkit-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/voltkit/", "644"],
    ["data/config.example.toml", "usr/share/doc/voltkit/examples/", "644"],
]

[profile.release]
lto = true
strip = true
codegen-units = 1
