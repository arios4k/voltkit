# The Snap Store package. Built and uploaded by .github/workflows/release.yml
# when a version tag is pushed; build it locally with `snapcraft pack`.
#
# Strict confinement: features that need the administrator password (GPU
# changes, /etc/hosts, typed triggers, drive health) work only in the APT and
# Fedora packages, and the app says so on each page (src/sandbox.rs). Plugs
# that aren't connected automatically are listed in the manual's Install page.
name: voltkit
base: core24
adopt-info: voltkit
grade: stable
confinement: strict
license: MIT
icon: data/icons/io.github.arios4k.Voltkit.svg
title: Voltkit
# Its own summary and description (instead of the MetaInfo's), so the Snap
# Store page says what the sandbox limits before anyone installs it.
summary: PowerToys-style desktop tools for Linux in one GTK4 app
description: |
  Voltkit puts the everyday tools you'd otherwise hunt down one by one into a single native GTK4 app, with one set of keyboard shortcuts. Built for Wayland and X11, it runs locally with no network access and no telemetry.

  **Tools in the snap**

  * **Text Extractor** (Super+Shift+T): drag a box around any text on screen, even in videos and images, and it lands on your clipboard
  * **Color Picker** (Super+Shift+C): an eyedropper for any pixel, HEX/RGB/HSL, WCAG contrast check and history
  * **Smart Paste** (Super+Shift+V): paste the clipboard converted: tidy JSON, a spreadsheet range as a Markdown table, a link without tracking, PDF text without broken lines, or the text in a copied image
  * **QR Code** (Super+Shift+Q): read a QR code anywhere on screen, or turn text, links and Wi-Fi details into one
  * **Screen Ruler** (Super+Shift+R): freeze the screen and measure anything in pixels
  * **Zoom & Annotate** (Super+Shift+Z): freeze the screen, zoom in and draw on it with a pen, arrows, boxes and text
  * **Text Expansion** (Super+Shift+E): a searchable snippet picker with dates, your clipboard and fill-in fields
  * **Asset Compressor**: drop PNG, JPEG, WebP or MP4 files to strip metadata and shrink them
  * **Batch Rename**: rename many files at once with search and replace, regular expressions and numbering, with a preview and undo
  * **Folder Compare**: find missing or changed files and verify backups byte for byte
  * **Storage Map**: see what takes up disk space in a clickable treemap and find the biggest files
  * **Image Resizer**: resize many pictures at once, keeping their shape, without touching the originals
  * **Keep Awake**: stop your computer from sleeping or locking for 30 minutes to 4 hours, or until you turn it off
  * **Shortcut Detective**: press any shortcut to see what owns it, find clashes, pick a free combination and change it
  * **What's Using This?**: see which apps keep a file, folder, drive or port busy, and close them
  * **Why Didn't It Sleep?**: see what keeps the computer awake, what woke it up, and how much battery it used asleep
  * **System Report**: your hardware explained, with driver checks, temperatures, what changed since an update, and a report that's safe to share
  * **GPU Tuner**: monitor NVIDIA, AMD and Intel graphics cards

  **Manual**

  The Voltkit Manual explains every tool step by step: https://arios4k.github.io/voltkit/manual/

  **About the snap version**

  Snaps run in a sandbox that can't ask for your administrator password, change system files or read the desktop's permission store. These work only when Voltkit is installed with APT (Ubuntu, Debian) or DNF (Fedora):

  * changing GPU settings (power limit, fans, clocks, voltage)
  * Hosts & Environment (editing /etc/hosts and session environment variables)
  * App Permissions
  * typed triggers such as ;date
  * drive health, memory slots and firmware update checks
  * stopping a USB device from waking the computer

  Each affected page in the app says so. A few tools need a permission you connect once with sudo snap connect; the app lists the exact commands, and so does voltkit doctor. After installing: https://arios4k.github.io/voltkit/manual/install.html#snap-store
website: https://arios4k.github.io/voltkit/manual/
source-code: https://github.com/arios4k/voltkit
issues: https://github.com/arios4k/voltkit/issues
contact: https://github.com/arios4k/voltkit/issues

platforms:
  amd64:

apps:
  voltkit:
    command: usr/bin/voltkit
    common-id: io.github.arios4k.Voltkit
    desktop: usr/share/applications/io.github.arios4k.Voltkit.desktop
    extensions: [gnome]
    # snapd starts the background service at login from the entry Voltkit
    # writes in its own config folder ($SNAP_USER_DATA/.config/autostart).
    autostart: io.github.arios4k.Voltkit.Daemon.desktop
    environment:
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
    plugs:
      - home
      - removable-media
      - hardware-observe
      - system-observe
      - mount-observe
      - process-control
      - log-observe
      - login-session-observe
      - upower-observe
      - opengl
      - gsettings

parts:
  voltkit:
    # Built with cargo directly: the GNOME extension points LD_LIBRARY_PATH at
    # its SDK's libc, which the rustup-installed toolchain can't run with, so
    # cargo runs without it (linking still finds GTK through pkg-config).
    plugin: nil
    source: .
    build-snaps: [rustup]
    build-packages: [pkg-config, gcc]
    parse-info: [usr/share/metainfo/io.github.arios4k.Voltkit.metainfo.xml]
    stage-packages:
      - tesseract-ocr
      - tesseract-ocr-eng
      - jpegoptim
      - webp
      - ffmpeg
      - wl-clipboard
      - xclip
    override-build: |
      env -u LD_LIBRARY_PATH rustup default stable
      env -u LD_LIBRARY_PATH PKG_CONFIG=/usr/bin/pkg-config cargo build --release --locked
      install -Dm755 target/release/voltkit -t "$CRAFT_PART_INSTALL/usr/bin/"
      install -Dm644 data/io.github.arios4k.Voltkit.metainfo.xml -t "$CRAFT_PART_INSTALL/usr/share/metainfo/"
      install -Dm644 data/icons/io.github.arios4k.Voltkit.svg -t "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/"
      install -Dm644 data/icons/io.github.arios4k.Voltkit-symbolic.svg -t "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/symbolic/apps/"
      install -Dm644 data/io.github.arios4k.Voltkit.desktop -t "$CRAFT_PART_INSTALL/usr/share/applications/"
      # The launcher outside the sandbox needs the icon's full path.
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.svg|' "$CRAFT_PART_INSTALL/usr/share/applications/io.github.arios4k.Voltkit.desktop"
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

  # Removes libraries the runtime snaps already provide. Stage-packages pull
  # older copies from the Ubuntu archive (HarfBuzz, librsvg...), which would
  # load instead of the GNOME runtime's and crash it (undefined symbol hb_free).
  cleanup:
    after: [voltkit]
    plugin: nil
    build-snaps: [core24, gnome-46-2404, mesa-2404]
    override-prime: |
      set -eux
      for snap in core24 gnome-46-2404 mesa-2404; do
        (cd "/snap/$snap/current" && find . -type f,l -printf "$CRAFT_PRIME/%P\0") | xargs -0 rm -f
      done
